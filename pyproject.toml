[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "packrehearsal"
version = "1.1.0"
description = "Audit release artifacts and generate evidence-bounded Codex maintenance tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yuqin Li" }]
keywords = ["codex", "ai-agents", "release", "packaging", "supply-chain", "npm", "python", "rust"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
rehearsal = [
  "build>=1.2",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.11",
  "mypy>=1.15",
]

[project.scripts]
packrehearsal = "packrehearsal.cli:main"

[project.urls]
Changelog = "https://github.com/liyuqin606-del/packrehearsal/blob/main/CHANGELOG.md"
Documentation = "https://github.com/liyuqin606-del/packrehearsal#readme"
Homepage = "https://github.com/liyuqin606-del/packrehearsal"
Issues = "https://github.com/liyuqin606-del/packrehearsal/issues"
Repository = "https://github.com/liyuqin606-del/packrehearsal"

[tool.hatch.build.targets.wheel]
packages = ["src/packrehearsal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["packrehearsal"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["packrehearsal"]
