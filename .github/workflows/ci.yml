name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build the Release Gate WebUI
        run: npm run build
      - name: Test the static hosting worker
        run: npm run test:sites

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Verify lock and formatting
        run: |
          uv lock --check
          uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/packrehearsal
      - name: Test with branch coverage
        run: uv run pytest --cov=packrehearsal --cov-branch --cov-report=term
      - name: Dogfood the safe static scan
        run: |
          uv run packrehearsal scan . --format json --output packrehearsal-report.json
          uv run packrehearsal codex-brief . \
            --format json \
            --output codex-maintenance-task.json

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked test environment
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: uv sync --frozen --extra dev --python "$MATRIX_PYTHON"
      - name: Run tests
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: uv run --python "$MATRIX_PYTHON" pytest

  package:
    name: Package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked build environment
        run: uv sync --frozen --extra dev
      - name: Build distributions
        run: uv run python -m build
      - name: Inspect release artifacts
        run: |
          uv run packrehearsal inspect dist/*.whl --format json --output wheel-report.json
          uv run packrehearsal inspect dist/*.tar.gz --format json --output sdist-report.json
          uv run packrehearsal scan . \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz \
            --format json \
            --output release-report.json
          uv run packrehearsal codex-brief . \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz \
            --format json \
            --output codex-release-task.json
      - name: Verify clean wheel installation
        run: |
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/packrehearsal --version
          .release-venv/bin/packrehearsal scan . \
            --no-repo-config \
            --format json \
            --output installed-release-report.json
      - name: Upload distributions and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packrehearsal-distributions
          path: |
            dist/*
            wheel-report.json
            sdist-report.json
            release-report.json
            installed-release-report.json
            codex-release-task.json
          if-no-files-found: error
          retention-days: 14
